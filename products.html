<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Self-wedding — SILUA</title>
  <meta name="description" content="브랜드의 제품(컬렉션)을 소개합니다." />
  <link rel="icon" type="image/png" href="images/silua-main-logo.png?v=2" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="nav">
    <div class="nav-inner">
      <a href="index.html" class="logo"><img class="brand-logo header-logo" src="images/silua-logo.png" alt="실루아" /></a>
      <button class="nav-toggle" aria-label="메뉴 열기">☰</button>
      <nav class="nav-menu">
        <a href="index.html">HOME</a>
        <a href="about.html">INTRODUCE</a>
        <a href="products.html?collection=self-wedding" data-collection="self-wedding">Self-wedding</a>
        <a href="products.html?collection=evening-party" data-collection="evening-party">Evening &amp; Party</a>
        <a href="products.html?collection=suit" data-collection="suit">Suit</a>
        <a href="products.html?collection=accessory" data-collection="accessory">Accessory</a>
        <a href="contact.html#reservation" data-reservation-link>Reservation</a>
        <a href="contact.html">문의</a>
      </nav>
    </div>
  </header>

  <!-- [작성서 05: 취급 품목] -->
  <section class="page-head">
    <h1 id="collection-title">Self-wedding</h1>
    <p id="collection-note">셀프 웨딩을 위한 컬렉션을 소개합니다.</p>
  </section>

  <!-- ===== 제품 목록 =====
       ★ 제품은 여기 HTML이 아니라 products.json 파일에서 관리합니다.
       products.json에 제품을 추가하면 이 목록과 상세 페이지에 자동으로 나타납니다. -->
  <section class="section">
    <div class="grid" id="product-list">
      <!-- products.json 내용이 자동으로 채워집니다 -->
    </div>
  </section>

  <footer class="footer">
    <p class="logo"><img class="brand-logo footer-logo" src="images/silua-logo.png" alt="실루아" /></p>
    <p class="biz">
      상호: ○○○ · 대표자: ○○○<br />
      사업자등록번호: 000-00-00000 · 주소: ○○○
    </p>
    <p>© SILUA. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
  <script src="catalog.js?v=20260826-rich-editor-1"></script>
  <script>
    // 상단 컬렉션 탭과 제품의 기존 category 값을 연결합니다.
    const collectionSlug = new URLSearchParams(window.location.search).get("collection") || "self-wedding";
    const collections = {
      "self-wedding": {
        label: "Self-wedding",
        description: "셀프 웨딩을 위한 컬렉션을 소개합니다.",
        aliases: ["self-wedding", "self wedding", "wedding", "웨딩", "dress"],
      },
      "evening-party": {
        label: "Evening & Party",
        description: "이브닝과 파티를 위한 컬렉션을 소개합니다.",
        aliases: ["evening-party", "evening & party", "evening", "party", "파티"],
      },
      suit: {
        label: "Suit",
        description: "단정한 실루엣의 수트 컬렉션을 소개합니다.",
        aliases: ["suit", "수트", "정장"],
      },
      accessory: {
        label: "Accessory",
        description: "스타일을 완성하는 액세서리 컬렉션을 소개합니다.",
        aliases: ["accessory", "accessories", "액세서리", "악세서리"],
      },
    };
    const selectedCollection = collections[collectionSlug] || collections["self-wedding"];
    const collectionTitle = document.getElementById("collection-title");
    const collectionNote = document.getElementById("collection-note");

    collectionTitle.textContent = selectedCollection.label;
    collectionNote.textContent = selectedCollection.description;
    document.title = selectedCollection.label + " — SILUA";

    const normalizeCategory = (value) => String(value || "").trim().toLowerCase().replace(/[\s_-]+/g, " ");

    // 공개된 products.json 제품을 카드로 그립니다. 학생은 CSS로 자유롭게 디자인할 수 있습니다.
    ProductCatalog.loadVisibleProducts()
      .then((products) => {
        const box = document.getElementById("product-list");
        const aliases = selectedCollection.aliases.map(normalizeCategory);
        const matchedProducts = products.filter((product) => {
          const category = normalizeCategory(product.category);
          return aliases.some((alias) => category === alias || category.includes(alias));
        });
        const visibleProducts = matchedProducts.length ? matchedProducts : products;

        if (!matchedProducts.length && products.length) {
          collectionNote.textContent = selectedCollection.description + " 현재는 전체 컬렉션을 함께 보여드립니다.";
        }

        box.innerHTML = visibleProducts
          .map((p) => {
            const image = ProductCatalog.safeImageUrl(p.images && p.images[0]);
            const img = image
              ? '<img src="' + ProductCatalog.escapeHtml(image) + '" alt="' + ProductCatalog.escapeHtml(p.name) + '" onerror="this.remove()" />'
              : "";
            const price = p.price ? '<p class="price">' + ProductCatalog.escapeHtml(p.price) + "</p>" : "";
            return (
              '<a class="card" href="product.html?id=' + encodeURIComponent(p.id) + '">' +
              '<div class="card-img">' + img + "</div>" +
              '<p class="k">' + ProductCatalog.escapeHtml(p.label || p.category || "") + "</p>" +
              "<h3>" + ProductCatalog.escapeHtml(p.name) + "</h3>" +
              "<p>" + ProductCatalog.escapeHtml(p.summary || "") + "</p>" + price +
              "</a>"
            );
          })
          .join("");
      })
      .catch(() => {
        document.getElementById("product-list").innerHTML =
          "<p>제품을 불러오지 못했습니다. 로컬에서는 npx serve 로 미리보기 하세요.</p>";
      });
  </script>
</body>
</html>
